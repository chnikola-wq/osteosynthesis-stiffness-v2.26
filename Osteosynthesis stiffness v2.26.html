                                    {/* 3. EXPLANATION BOX */}
                                    <div className="bg-slate-800 text-white p-6 rounded-2xl shadow-sm">
                                        <h3 className="text-sm font-bold text-slate-300 uppercase tracking-widest mb-4 flex items-center">
                                            <InfoIcon /> Geometric Stiffness vs. Material Rigidity
                                        </h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm leading-relaxed">
                                            <div>
                                                <p className="font-bold text-blue-300 mb-1">Stiffness (AMI) <Latex math="(I)" /></p>
                                                <p className="text-slate-300 text-xs">Area Moment of Inertia. A purely geometric property representing resistance to bending deformation. It increases with the <strong className="text-white">cube (3rd power)</strong> of the plate's dimension parallel to the bending force (<strong className="text-blue-200">{singlePlatePos === 'Medial' ? 'Thickness' : 'Width'}</strong> for AP bending, <strong className="text-blue-200">{singlePlatePos === 'Medial' ? 'Width' : 'Thickness'}</strong> for ML bending). It is independent of the metal chosen.</p>
                                            </div>
                                            <div>
                                                <p className="font-bold text-amber-400 mb-1">Strength <Latex math={"(M_{\\text{max}})"} /></p>
                                                <p className="text-slate-300 text-xs">Maximum Bending Moment before failure. This calculates the actual physical load (in Newton-metres) required to permanently yield the plate. It is derived directly from the bending stress formula by rearranging it to solve for <Latex math="M" /> when stress hits the selected material's yield point (<Latex math={"M_{\\text{max}} = \\frac{\\sigma_{\\text{yield}} \\cdot I}{y_{\\text{max}}}"} />).</p>
                                            </div>
                                            <div>
                                                <p className="font-bold text-rose-300 mb-1">Fatigue <Latex math={"(M_{\\text{fatigue}})"} /></p>
                                                <p className="text-slate-300 text-xs">While Stainless Steel and Titanium yield at very similar absolute loads, their cyclic fatigue endurance differs dramatically. Steel can tolerate significantly larger repetitive forces indefinitely compared to Titanium. This translates directly to the calculated Fatigue limit metric.</p>
                                            </div>
                                        </div>
                                        <div className="text-xs text-slate-400 mt-4 pt-4 border-t border-slate-700 italic">
                                            <p>Note: True flexural rigidity is the product of Geometric Stiffness (<Latex math="I" />) and the material's Young's Modulus (<Latex math="E" />). While <Latex math="I" /> remains constant for a given shape, a Steel plate will deform less than a Titanium plate under the same load due to its higher Modulus. The app incorporates <Latex math="E" /> when calculating the Composite Modular Ratio (<Latex math="n" />).</p>
                                        </div>
                                    </div>
                                    
                                    {/* 4. CLINICAL LOGIC BOXES */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                                        <section className="bg-blue-600 dark:bg-blue-800 text-white p-6 rounded-2xl shadow-xl transition-colors duration-300">
                                            <h2 className="text-xs font-bold text-blue-200 dark:text-blue-300 uppercase tracking-widest mb-4">Directional Mechanics</h2>
                                            <div className="space-y-3 text-sm leading-relaxed">
                                                <p>In biological reality, a bone plate only acts as a composite structure when it lies directly in the plane of the bending load (Tension Band). When loaded orthogonally, the fracture gaps open and the stiffness plummets (Open-Gap).</p>
                                                <p className="bg-blue-800 dark:bg-blue-900/50 p-3 rounded-lg border border-blue-500 dark:border-blue-700 font-medium italic">Notice how placing the plate Anteriorly vs Medially drastically swaps the XX and YY resistance mechanics between Tension Band and Open-Gap modes.</p>
                                            </div>
                                        </section>
                                        <section className="bg-amber-50 dark:bg-amber-900/20 p-6 rounded-2xl shadow-sm border border-amber-200 dark:border-amber-700/50 transition-colors duration-300">
                                            <h2 className="text-xs font-bold text-amber-800 dark:text-amber-400 uppercase tracking-widest mb-2 flex items-center">
                                                <InfoIcon /> The Stiffness vs. Stress and Strength Paradox
                                            </h2>
                                            <p className="text-sm text-amber-900 dark:text-amber-200 leading-relaxed mb-3">
                                                While stiffness correlates with implant strength, they scale differently. <strong>Stiffness</strong> increases with the <strong>cube</strong> of dimensions, while <strong>Implant Strength</strong> (maximum moment before failure) only increases with the <strong>square</strong>. Doubling plate thickness makes it 8x stiffer but only 4x stronger! By changing dimensions, we may make the construct hyper-stiff, but we increase its actual strength to a lesser degree. This overly stiff plate forces screws to bear the load, risking failure.
                                            </p>
                                            <div className="text-xs text-amber-900 dark:text-amber-200 border-t border-amber-200 dark:border-amber-700/50 pt-3">
                                                <strong>Note:</strong> We must distinguish between <em>Material Strength</em> (the metal's fixed yield stress) and <em>Implant Strength</em> (the load capacity). Decreasing stress and increasing strength are expressions of the same thing: reducing the stress generated by a specific load allows you to apply a greater moment before the material yields.
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            </div>
                        )}

                                                    <div className="text-xs text-indigo-800 dark:text-indigo-300 leading-relaxed">
                                                        <strong className="block mb-1 text-indigo-900 dark:text-indigo-200">Asymmetric Bending Mechanics</strong>
                                                        An "L-shape" cross-section is asymmetric, meaning its principal axes of inertia are rotated relative to the anatomical AP and ML planes. Loading this construct purely along an anatomical axis results in off-axis bending. This induces coupled torsion alongside the primary bending moment, leading to higher localised stresses at the outermost surfaces of the plates.

                                                        <strong className="block mb-1 text-amber-900 dark:text-amber-300">Stiffness vs. Strength Trade-off</strong>
                                                        The metrics below demonstrate that the 90° Orthogonal configuration typically provides higher Area Moment of Inertia (<Latex math="(I)" />) than the 180° Parallel setup, indicating greater stiffness. However, due to the coupled torsion and increased stress concentrations described above, it reaches yield stress at a lower Maximum Moment (<Latex math={"(M_{\\text{max}})"} />).

                                            </div>

                                                Surgeons frequently interchange "Stiffness" and "Strength", but mathematically they represent different clinical concepts. To understand when an implant will actually fail (yield or fracture), we use the <strong>Engineering Theory of Bending</strong>. This theory calculates the actual physical stress (<Latex math={"\\sigma"} />) experienced at any point inside the implant when a bending load is applied.

                                                            <Latex math={`\\sigma = \\frac{M \\cdot y}{I}`} />

                                                            <Latex math={`\\sigma = \\frac{M \\cdot \\left(\\frac{w}{2}\\right)}{\\left(\\frac{t \\cdot w^3}{12}\\right)}`} />

                                            <p className="text-sm text-slate-700 dark:text-slate-300 leading-relaxed mt-4">
                                                The algebra clearly demonstrates that while Stiffness (<Latex math="I" />) is governed by the <strong>cube</strong> of the {paradoxWordMajor} (<Latex math={`${paradoxVarMajor}^3`} />), the actual Maximum Stress (<Latex math={"\\sigma"} />) on the plate is only inversely proportional to the <strong>square</strong> of the {paradoxWordMajor} (<Latex math={`${paradoxVarMajor}^2`} />). Because stress is reduced by a factor of 4, you can apply 4 times the external moment before hitting the material's yield point. Therefore, <strong>Implant Strength</strong> scales directly with the square (<Latex math={`${paradoxVarMajor}^2`} />).
                                            </p>
                                            <p className="text-sm text-amber-900 dark:text-amber-200 bg-amber-50 dark:bg-amber-900/20 p-4 rounded-lg leading-relaxed mt-4 italic border border-amber-200 dark:border-amber-700/50 shadow-sm">
                                                <strong>Clinical Takeaway:</strong> You have created a hyper-rigid construct that forces the screws to absorb massive load transfers (because the plate won't flex to share the stress with the bone), but the plate itself hasn't gained as much actual breaking strength as you might assume.

                                    {/* PART B: SINGLE PLATE MECHANICS */}
                                    <div className="border-l-4 border-blue-500 pl-4 md:pl-6 pb-2">
                                        <h2 className="text-xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-widest mb-6">Part B: Directional Stability (Single Plate)</h2>
                                        <p className="text-sm text-slate-700 dark:text-slate-300 mb-8 leading-relaxed">
                                            A standard textbook assumption is that a plate screwed to bone acts as a perfect Composite Beam. Clinically, this is fundamentally flawed. Fractured bone cannot transmit tension. Therefore, a plated fracture acts as a <strong>Composite Beam</strong> in one plane, but instantly degrades to a <strong>Gapping Tension-Tie</strong> when loaded orthogonally.
                                        </p>
                                        
                                        <section className="mb-10">
                                            <h3 className="text-lg font-bold text-blue-800 dark:text-blue-400 border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">1. In-Plane Bending: Tension Band Osteosynthesis</h3>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                When the bending load pushes the bone fragments together, the bone actively resists compression while the plate resists tension. The structure shares the load. To calculate the combined stiffness, we find the <strong>Modular Ratio</strong> (<Latex math={`n = \\frac{E_{\\text{plate}}}{E_{\\text{bone}}} = \\mathbf{${singleStats.n.toFixed(2)}}`} />) and use it to locate the unified neutral axis.
                                            </p>
                                            
                                            <div className="bg-slate-50 dark:bg-slate-900/50 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                                                <h4 className="font-bold text-slate-800 dark:text-slate-200 border-b border-slate-200 dark:border-slate-700 pb-2">Step 1.1: Neutral Axis Shift <Latex math={`(\\bar{x}, \\bar{y})`} /></h4>
                                                <p className="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                                                    Because the plate is stiffer, the axis of bending is pulled away from the centre of the bone towards the metal. To find exactly where the neutral axis sits, we use the <strong>First Moment of Area</strong> about the bone's geometric centre <Latex math="(0,0)" />, combining the natural bone area with the transformed plate area <Latex math={`A_{\\text{eq}} = n \\cdot A_{\\text{plate}}`} /> (for the <strong>{singlePlatePos}</strong> plate under <strong>{singlePlatePos === 'Medial' ? 'ML' : 'AP'} Bending</strong>):
                                                </p>

                                                <div className="bg-slate-800 text-blue-100 p-5 rounded-xl text-sm shadow-inner flex flex-col md:flex-row justify-center items-center gap-6">
                                                    <Latex math={`\\bar{x} = \\frac{\\sum(A_i \\cdot x_i)}{\\sum A_i}`} />
                                                    <Latex math={`\\bar{y} = \\frac{\\sum(A_i \\cdot y_i)}{\\sum A_i}`} />
                                                </div>

                                                <div className="bg-blue-50 dark:bg-blue-900/20 p-5 rounded-xl border border-blue-100 dark:border-blue-800/50 shadow-sm">
                                                    <h5 className="font-bold text-blue-800 dark:text-blue-300 mb-2">Defining our distances (<Latex math="x_i" /> or <Latex math="y_i" />)</h5>
                                                    <ul className="list-disc pl-5 text-sm text-blue-900 dark:text-blue-200 space-y-2">
                                                        <li><strong>Bone:</strong> Its geometric centre sits on the origin, so its distance to the reference axis is <strong>0</strong>.</li>
                                                        <li><strong>Plate:</strong> Its centre sits one bone radius plus half the plate thickness from the origin: <Latex math={`d = ${singlePlatePos === 'Medial' ? 'a' : 'b'} + \\tfrac{t}{2} = \\mathbf{${singleStats.d_plate.toFixed(2)} \\text{ mm}}`} />.</li>
                                                        <li><strong>Symmetry (why one coordinate is 0):</strong> A <strong>{singlePlatePos}</strong> plate only shifts the centroid along the <strong>{singlePlatePos === 'Medial' ? 'X' : 'Y'}</strong>-axis, so <Latex math={singlePlatePos === 'Medial' ? `\\bar{y} = 0` : `\\bar{x} = 0`} />.</li>
                                                    </ul>
                                                </div>

                                                <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-5 shadow-sm space-y-5">
                                                    <div className="flex flex-col items-center">
                                                        <span className="text-slate-500 dark:text-slate-400 font-semibold mb-2 w-full text-left">Total transformed area:</span>
                                                        <Latex math={`\\sum A_i = A_{\\text{bone}} + A_{\\text{eq}} = ${Math.round(singleStats.A_b)} + ${Math.round(singleStats.A_p_eq)} = \\mathbf{${Math.round(singleStats.A_b + singleStats.A_p_eq)} \\text{ mm}^2}`} />
                                                    </div>
                                                    <div className="flex flex-col items-center border-t border-slate-100 dark:border-slate-700 pt-4">
                                                        <span className="text-slate-500 dark:text-slate-400 font-semibold mb-2 w-full text-left">First Moment in <Latex math={singlePlatePos === 'Medial' ? 'X' : 'Y'} />:</span>
                                                        <Latex math={singlePlatePos === 'Medial'
                                                            ? `\\sum(A_i \\cdot x_i) = (A_{\\text{bone}} \\cdot 0) + (A_{\\text{eq}} \\cdot d) = (${Math.round(singleStats.A_p_eq)} \\cdot ${singleStats.d_plate.toFixed(2)}) = \\mathbf{${Math.round(singleStats.A_p_eq * singleStats.d_plate)} \\text{ mm}^3}`
                                                            : `\\sum(A_i \\cdot y_i) = (A_{\\text{bone}} \\cdot 0) + (A_{\\text{eq}} \\cdot d) = (${Math.round(singleStats.A_p_eq)} \\cdot ${singleStats.d_plate.toFixed(2)}) = \\mathbf{${Math.round(singleStats.A_p_eq * singleStats.d_plate)} \\text{ mm}^3}`} />
                                                    </div>
                                                    <div className="flex flex-col items-center border-t border-slate-100 dark:border-slate-700 pt-4 bg-slate-50 dark:bg-slate-900/50 p-3 rounded mt-4">
                                                        <span className="text-blue-600 dark:text-blue-400 font-bold mb-2 w-full text-center">Neutral axis shift <Latex math={`(\\bar{x}, \\bar{y})`} /></span>
                                                        <Latex math={singlePlatePos === 'Medial'
                                                            ? `\\bar{x}_{\\text{composite}} = \\frac{A_{\\text{eq}} \\cdot d}{A_{\\text{bone}} + A_{\\text{eq}}} = \\frac{${Math.round(singleStats.A_p_eq * singleStats.d_plate)}}{${Math.round(singleStats.A_b + singleStats.A_p_eq)}}`
                                                            : `\\bar{y}_{\\text{composite}} = \\frac{A_{\\text{eq}} \\cdot d}{A_{\\text{bone}} + A_{\\text{eq}}} = \\frac{${Math.round(singleStats.A_p_eq * singleStats.d_plate)}}{${Math.round(singleStats.A_b + singleStats.A_p_eq)}}`} />
                                                        <Latex math={singlePlatePos === 'Medial'
                                                            ? `= \\mathbf{(${singleStats.cx_tb.toFixed(2)} \\text{ mm},\\; 0 \\text{ mm})}`
                                                            : `= \\mathbf{(0 \\text{ mm},\\; ${singleStats.cy_tb.toFixed(2)} \\text{ mm})}`} />
                                                    </div>
                                                </div>

                                                <h4 className="font-bold text-slate-800 dark:text-slate-200 border-b border-slate-200 dark:border-slate-700 pb-2 mt-8">Step 1.2: Composite Area Moment of Inertia</h4>
                                                <p className="text-sm text-slate-600 dark:text-slate-400 leading-relaxed mb-4">
                                                    Using the Parallel Axis Theorem, we sum the stiffness of the bone and the transformed plate relative to the newly shifted axis:
                                                </p>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div className="p-4 bg-white dark:bg-slate-800 rounded border border-slate-100 dark:border-slate-700">
                                                        <span className="text-xs font-bold text-slate-500 mb-2 block">Bone Contribution:</span>
                                                        <Latex math={`I_{\\text{bone, shifted}} = I_{\\text{bone}} + A_{\\text{bone}} \\cdot (\\text{shift})^2`} />
                                                    </div>
                                                    <div className="p-4 bg-white dark:bg-slate-800 rounded border border-slate-100 dark:border-slate-700">
                                                        <span className="text-xs font-bold text-slate-500 mb-2 block">Plate Contribution:</span>
                                                        <Latex math={`I_{\\text{plate, shifted}} = n \\cdot I_{\\text{plate}} + (n \\cdot A_{\\text{plate}}) \\cdot (d - \\text{shift})^2`} />
                                                    </div>
                                                </div>
                                                
                                                <div className="p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-200 dark:border-blue-800 text-center mt-4">
                                                    <span className="text-sm font-bold text-blue-800 dark:text-blue-300 mb-2 block">Total Composite Stiffness <Latex math={singlePlatePos === 'Medial' ? "(I_{yy})" : "(I_{xx})"} /></span>
                                                    <Latex math={`I_{\\text{total}} = \\mathbf{${Math.round(singlePlatePos === 'Medial' ? singleStats.I_yy : singleStats.I_xx).toLocaleString()} \\text{ mm}^4}`} />
                                                </div>
                                            </div>
                                        </section>

                                        <section className="mb-10">
                                            <h3 className="text-lg font-bold text-amber-800 dark:text-amber-400 border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">2. Out-of-Plane Bending: Open-Gap Osteosynthesis</h3>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                When the limb is loaded orthogonally (e.g., AP bending on a Medial plate), the bone immediately gaps open on the far cortex. The bone ceases to transmit forces. The structural neutral axis instantly drops from the centre of the construct and anchors itself onto the far opposing cortex, which acts as a pure hinge/fulcrum.
                                            </p>

                                            <div className="bg-slate-50 dark:bg-slate-900/50 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-6">
                                                <h4 className="font-bold text-slate-800 dark:text-slate-200 border-b border-slate-200 dark:border-slate-700 pb-2">Step 2.1: Open-Gap Inertia</h4>
                                                <p className="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                                                    Because the bone provides no stiffness, the Modular Ratio (<Latex math="n" />) is abandoned. We calculate the stiffness exclusively from the plate, using the Parallel Axis Theorem relative to the far cortical fulcrum:
                                                </p>
                                                
                                                <div className="bg-white dark:bg-slate-800 p-4 rounded border border-slate-100 dark:border-slate-700 flex flex-col items-center">
                                                    <Latex math={`I_{\\text{open-gap}} = I_{\\text{plate, local}} + A_{\\text{plate}} \\cdot d_{\\text{fulcrum}}^2`} />
                                                </div>

                                                <p className="text-sm text-slate-600 dark:text-slate-400 leading-relaxed mt-4">
                                                    For a <strong>{singlePlatePos}</strong> plate resisting <strong>{singlePlatePos === 'Medial' ? 'AP' : 'ML'} Bending</strong>, the fulcrum is located on the {singlePlatePos === 'Medial' ? 'Anterior/Posterior' : 'Medial/Lateral'} cortex. The distance (<Latex math={"d_{\\text{fulcrum}}"} />) is simply the bone radius <Latex math={singlePlatePos === 'Medial' ? "b" : "a"} />.
                                                </p>

                                                <div className="p-4 bg-amber-50 dark:bg-amber-900/20 rounded-lg border border-amber-200 dark:border-amber-800 text-center mt-4">
                                                    <span className="text-sm font-bold text-amber-800 dark:text-amber-400 mb-2 block">Total Open-Gap Stiffness <Latex math={singlePlatePos === 'Medial' ? "(I_{xx})" : "(I_{yy})"} /></span>
                                                    <Latex math={`I_{\\text{total}} = \\mathbf{${Math.round(singlePlatePos === 'Medial' ? singleStats.I_xx : singleStats.I_yy).toLocaleString()} \\text{ mm}^4}`} />
                                                </div>
                                            </div>
                                        </section>
                                        
                                        <section className="mb-4 mt-6 pt-6 border-t border-slate-300 dark:border-slate-700">
                                            <h3 className="text-lg font-bold text-slate-800 dark:text-slate-300 pb-2 mb-4">3. Maximum Bending Moment (Strength)</h3>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                To calculate the maximum force the limb can endure before the plate permanently bends, we rearrange the Bending Stress formula (<Latex math={"\\sigma_{\\text{yield}} = \\frac{M \\cdot y}{I}"} />). Note that in Composite Mode, the plate "feels" <Latex math="n" /> times more stress, so <Latex math="n" /> goes into the denominator.
                                            </p>
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                                <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col items-center">
                                                    <span className="text-xs font-bold text-blue-600 dark:text-blue-400 mb-2 block uppercase tracking-wider">Composite Mode</span>
                                                    <Latex math={`M_{\\text{max}} = \\frac{\\sigma_{\\text{yield}} \\cdot I_{\\text{composite}}}{n \\cdot y_{\\text{max\\_plate}} \\cdot 1000} \\text{ (Nm)}`} />
                                                </div>
                                                <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col items-center">
                                                    <span className="text-xs font-bold text-amber-600 dark:text-amber-500 mb-2 block uppercase tracking-wider">Open-Gap Mode</span>
                                                    <Latex math={`M_{\\text{max}} = \\frac{\\sigma_{\\text{yield}} \\cdot I_{\\text{open-gap}}}{y_{\\text{max\\_plate}} \\cdot 1000} \\text{ (Nm)}`} />
                                                </div>
                                            </div>
                                            <p className="text-xs text-slate-500 dark:text-slate-400 italic text-center">
                                                <Latex math={"\\div 1000"} /> is a unit conversion factor changing Newton-millimetres (N·mm) to standard clinical Newton-metres (Nm).
                                            </p>
                                        </section>

                                    </div>

                                    {/* PART C: BRIDGING (DOUBLE PLATE) */}
                                    <div className="border-l-4 border-indigo-500 pl-4 md:pl-6 pt-4">
                                        <h2 className="text-xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-widest mb-6">Part C: Bridging Gap (Double Plates)</h2>
                                        
                                        <p className="text-sm text-slate-700 dark:text-slate-300 mb-8 leading-relaxed">
                                            In a bridging construct across a comminuted gap, the bone carries zero load. Therefore, we do not need the Modular Ratio (<Latex math="n" />); the metal plates are the only structures resisting bending. The calculations below apply the Parallel Axis Theorem strictly to the two plates.
                                        </p>

                                        <section className="mb-8">
                                            <h3 className="text-lg font-bold text-indigo-800 dark:text-indigo-400 border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">1. Bridging Area Moment of Inertia (<Latex math={`${doubleConfig}^\\circ`} /> Configuration)</h3>
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <div className="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                                                    <span className="text-slate-800 dark:text-slate-200 font-bold block mb-4 border-b border-slate-100 dark:border-slate-700 pb-2">AP Bending <Latex math="(I_{xx})" /></span>
                                                    <div className="text-sm space-y-4 flex flex-col items-center">
                                                        <Latex math={`I_{\\text{plate 1}} = I_{\\text{local}} + A \\cdot (y_1 - \\bar{y})^2`} />
                                                        <Latex math={`I_{\\text{plate 2}} = I_{\\text{local}} + A \\cdot (y_2 - \\bar{y})^2`} />
                                                        <div className="border-t border-slate-100 dark:border-slate-700 pt-4 w-full flex justify-center text-red-600 dark:text-red-400 font-bold">
                                                            <Latex math={`\\sum I_{xx} = \\mathbf{${Math.round(doubleStats.I_xx).toLocaleString()} \\text{ mm}^4}`} />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                                                    <span className="text-slate-800 dark:text-slate-200 font-bold block mb-4 border-b border-slate-100 dark:border-slate-700 pb-2">ML Bending <Latex math="(I_{yy})" /></span>
                                                    <div className="text-sm space-y-4 flex flex-col items-center">
                                                        <Latex math={`I_{\\text{plate 1}} = I_{\\text{local}} + A \\cdot (x_1 - \\bar{x})^2`} />
                                                        <Latex math={`I_{\\text{plate 2}} = I_{\\text{local}} + A \\cdot (x_2 - \\bar{x})^2`} />
                                                        <div className="border-t border-slate-100 dark:border-slate-700 pt-4 w-full flex justify-center text-emerald-600 dark:text-emerald-400 font-bold">
                                                            <Latex math={`\\sum I_{yy} = \\mathbf{${Math.round(doubleStats.I_yy).toLocaleString()} \\text{ mm}^4}`} />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </section>

                                        <section className="mb-4 mt-10">
                                            <h3 className="text-lg font-bold text-red-800 dark:text-red-400 border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">2. The Principal Axes and the Asymmetric Penalty (90° Setup)</h3>
                                            
                                            <div className="bg-red-50 dark:bg-red-900/10 p-5 rounded-xl border border-red-200 dark:border-red-800/50 shadow-sm mb-6 space-y-4">
                                                <p className="text-sm text-red-900 dark:text-red-200 leading-relaxed font-bold">
                                                    A notable mechanical trade-off occurs in the 90° Orthogonal construct: The mathematical stiffness (<Latex math="(I_{xx})" /> and <Latex math="(I_{yy})" />) is significantly higher than the 180° Parallel construct, yet it yields at a consistently lower applied load (<Latex math={"(M_{\\text{max}})"} />). 
                                                </p>
                                            </div>

                                            <h4 className="font-bold text-slate-800 dark:text-slate-200 mb-2">The Concept of Principal Axes and Centre of Gravity</h4>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                Every structure has two <strong>Principal Axes</strong>—a "strong" axis and a "weak" axis. If you bend a structure perfectly along one of these axes, it bends cleanly. For a symmetric shape like an I-beam or two parallel 180° plates, these axes align perfectly with the vertical (AP) and horizontal (ML) planes.
                                            </p>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-6 leading-relaxed">
                                                However, for an asymmetric <strong>L-shape</strong> (the 90° setup), the mass is skewed into a single quadrant. This diagonal distribution of mass shifts the true centre of gravity (the centroid) and the structural balance of the construct. This naturally rotates the Principal Axes by roughly 45 degrees relative to the anatomical planes. 
                                            </p>

                                            <div className="bg-slate-100 dark:bg-slate-800 p-5 rounded-xl border-l-4 border-slate-400 dark:border-slate-500 mb-6">
                                                <h5 className="font-bold text-slate-800 dark:text-slate-200 mb-2">Bending Behaviour of Asymmetric Sections</h5>
                                                <p className="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                                                    When an asymmetrical profile (like an L-angle) is subjected to a bending moment that does not align with its principal axes, the resultant deflection is not purely in the direction of the load. The section will simultaneously bend and twist to align its deformation with its principal axes, a phenomenon known as coupled torsion.
                                                </p>
                                            </div>

                                            <h4 className="font-bold text-slate-800 dark:text-slate-200 mb-2">Coupled Torsion and Stress Distribution</h4>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                Applying a bending load strictly along the AP or ML anatomical planes forces the 90° construct to deform off-axis. The resulting coupled torsion generates additional shear and normal stresses that superimpose onto the primary bending stress.
                                            </p>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                Because these structural stresses scale with distance from the neutral axis, <strong>the highest stress concentrations occur at the outermost edges and far corners of the metal plates</strong>.
                                            </p>
                                            
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                To model this mathematically, we calculate the <strong>Product of Inertia (<Latex math="I_{xy}" />)</strong>, which measures how asymmetric the shape is. For the 90° setup, <Latex math={`I_{xy} = \\mathbf{${Math.round(doubleStats.I_xy_90).toLocaleString()} \\text{ mm}^4}`} />, a massive negative value. We then use the general formula for Asymmetric Bending:
                                            </p>

                                            <div className="bg-slate-800 text-blue-100 p-5 rounded-xl text-sm shadow-inner flex flex-col items-center gap-4 mb-6">
                                                <span className="text-xs font-bold text-slate-400">General Asymmetric Bending Stress Formula (for load <Latex math="M_x" />):</span>
                                                <Latex math={`\\sigma = M_x \\left| \\frac{-I_{yy} y + I_{xy} x}{I_{xx} \\cdot I_{yy} - I_{xy}^2} \\right|`} />
                                            </div>

                                            <h4 className="font-bold text-slate-800 dark:text-slate-200 mb-2">Algebraic Analysis of Yield Limits</h4>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                Look at the denominator of that formula: <Latex math={`\\Delta = I_{xx} \\cdot I_{yy} - I_{xy}^2`} />. 
                                            </p>
                                            <ul className="list-disc pl-5 text-sm text-slate-700 dark:text-slate-300 space-y-2 mb-6">
                                                <li>In a symmetric 180° setup, <Latex math="I_{xy} = 0" />. The denominator is large, and stress remains low.</li>
                                                <li>In the asymmetric 90° setup, <Latex math="I_{xy}^2" /> is a large number that is subtracted from the denominator.</li>
                                                <li>The subtracted <Latex math="I_{xy}^2" /> term reduces the overall denominator. This reduction geometrically amplifies the resulting internal stress (<Latex math={"\\sigma"} />) at the far corners. Consequently, the plate reaches its material yield point at a lower applied bending moment (<Latex math={"(M_{\\text{max}})"} />), even though its primary bending stiffness (<Latex math="I_{xx}" /> or <Latex math="I_{yy}" />) may be comparatively high.</li>
                                            </ul>

                                        </section>
                                    </div>

                                    {/* PART D: FATIGUE MECHANICS & S-N CURVES */}
                                    <div className="border-l-4 border-rose-500 pl-4 md:pl-6 pt-4">
                                        <h2 className="text-xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-widest mb-6">Part D: Fatigue Mechanics & Implant Lifespan</h2>
                                        
                                        <p className="text-sm text-slate-700 dark:text-slate-300 mb-6 leading-relaxed">
                                            The Yield Limit calculated in the sections above indicates the catastrophic force required to permanently deform the plate in a <strong>single cycle</strong>. However, in orthopaedics, implants almost never fail from a single catastrophic overload; they fail due to cyclical fatigue (e.g., millions of repetitive steps during the healing process).
                                        </p>

                                        <section className="mb-8">
                                            <h3 className="text-lg font-bold text-rose-800 dark:text-rose-400 border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">1. The S-N Endurance Curves (Wöhler curves)</h3>
                                            
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-6 leading-relaxed">
                                                By plotting the Stress Amplitude (<Latex math="S" />) against the Number of Cycles to Failure (<Latex math="N" />) on a logarithmic scale, we generate the S-N endurance curves for Titanium and Stainless Steel. The interactive graph below represents the conservative lower bounds of fatigue limits derived from Granta EduPack datasets.
                                            </p>

                                            <div className="my-8">
                                                <SNCurveGraph />
                                                <p className="text-xs text-slate-500 dark:text-slate-400 text-center mt-3">
                                                    Interactive S-N curves plotting the fatigue lifespan of idealised metal specimens. <br />
                                                    Data reference: <a href="https://www.bonesinvectors.com/post/a-simple-guide-to-your-material-graphs-strength-springiness-and-stamina" target="_blank" className="text-blue-500 hover:underline">A simple guide to material graphs: strength, springiness and stamina</a>
                                                </p>
                                            </div>

                                            <div className="bg-rose-50 dark:bg-rose-900/10 p-5 rounded-xl border border-rose-200 dark:border-rose-800/50 shadow-sm mb-6">
                                                <h4 className="font-bold text-rose-800 dark:text-rose-300 mb-2">The Critical Clinical Difference</h4>
                                                <p className="text-sm text-rose-900 dark:text-rose-200 leading-relaxed">
                                                    While both <strong>Ti-6Al-4V</strong> and <strong>SS 316LVM</strong> share a nearly identical yield strength (~850 MPa), their cyclic fatigue endurance diverges significantly over time. Cold-worked Stainless Steel possesses a distinctly higher fatigue limit at <Latex math="10^8" /> cycles (<Latex math="\sim 310" /> MPa) compared to Titanium (<Latex math="\sim 260" /> MPa). This explains why Steel implants can tolerate higher repetitive weight-bearing before failing.
                                                </p>
                                            </div>
                                        </section>

                                        <section className="mb-8">
                                            <h3 className="text-lg font-bold text-rose-800 dark:text-rose-400 border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">2. The Fatigue Modification Factor (<Latex math="K_f" />)</h3>
                                            
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                To be mathematically rigorous, we must acknowledge that S-N graphs are generated using highly polished, unnotched specimens. An orthopaedic plate is heavily notched by screw holes, which act as intense stress multipliers.
                                            </p>

                                            <div className="bg-slate-800 text-blue-100 p-5 rounded-xl text-sm shadow-inner flex flex-col items-center gap-4 mb-6">
                                                <span className="text-xs font-bold text-slate-400">Functional Fatigue Limit Calculation:</span>
                                                <Latex math={`M_{\\text{fatigue\\_functional}} = \\frac{1}{K_f} \\cdot \\left( \\frac{\\sigma_{\\text{fatigue}} \\cdot I}{y_{\\text{max}}} \\right)`} />
                                            </div>

                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                By applying an analytical Fatigue Reduction Factor (<Latex math="K_f = 2.0" />), the calculator translates the theoretical fatigue limits into a safer, more clinically realistic <strong>Functional Fatigue Limit</strong> that accounts for the geometric realities of plate design.
                                            </p>
                                        </section>
                                    </div>

                                    {/* PART E: THE MAX PATIENT WEIGHT BENCHMARK */}
                                    <div className="border-l-4 border-purple-500 pl-4 md:pl-6 pt-4">
                                        <h2 className="text-xl font-black text-slate-800 dark:text-slate-100 uppercase tracking-widest mb-6">Part E: The "Max Safe Patient Weight" Benchmark</h2>
                                        
                                        <p className="text-sm text-slate-700 dark:text-slate-300 mb-6 leading-relaxed">
                                            A fundamental clinical question is: <em>"How many exact steps will this implant survive under this specific dog's weight?"</em> <br/><br/>
                                            Attempting to calculate a precise "cycle count until failure" directly from a patient's body weight breaks core biomechanical engineering logic. Doing so would require perfectly predicting highly dynamic and volatile variables, primarily the <strong>muscle envelope paradox</strong>. In living animals, actively contracting muscles act as biological tension bands. This drastically alters the local bending moment across a fracture, meaning the actual internal stress is rarely perfectly proportional to the external Ground Reaction Force (GRF).
                                        </p>

                                        <section className="mb-8">
                                            <h3 className="text-lg font-bold text-purple-800 dark:text-purple-400 border-b border-slate-200 dark:border-slate-700 pb-2 mb-4">The Solution: A Standardised Worst-Case Benchmark</h3>
                                            
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                Because we cannot perfectly simulate every patient's muscle biology, the only mathematically rigorous solution is to calculate a <strong>Standardised Worst-Case Scenario</strong>. We explicitly strip away all muscle protection and assume a highly conservative test environment. 
                                            </p>

                                            <div className="bg-purple-50 dark:bg-purple-900/10 p-5 rounded-xl border border-purple-200 dark:border-purple-800/50 shadow-sm mb-6 space-y-4 text-sm text-purple-900 dark:text-purple-200">
                                                <p><strong>To calculate this benchmark, the application hard-codes the following extreme assumptions:</strong></p>
                                                <ul className="list-disc pl-5 space-y-2">
                                                    <li><strong>Dynamic Load (Impact/Stumble):</strong> A gentle trot produces ~1.2x Body Weight. However, dogs trip, jump, and resist cage rest. We assume a peak impact Ground Reaction Force of exactly <strong>2.5 × Body Weight</strong>.</li>
                                                    <li><strong>Eccentric Load Offset (Lever Arm):</strong> A fixed 10cm absolute offset heavily over-penalises small implants (forcing a toy-breed plate to endure a Mastiff-sized physical displacement). Instead, we assume a severe eccentric loading scenario where the mechanical offset is dynamically equal to the <strong>Bone's Diameter</strong>. This realistically scales the worst-case bending lever arm to the physical size of the patient being modelled.</li>
                                                </ul>
                                            </div>

                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-4 leading-relaxed">
                                                By taking the Functional Fatigue Limit (<Latex math={"M_{\\text{fatigue\\_functional}}"} />) and running the physics equations backwards through these specific assumptions, we calculate the threshold limit in kilograms:
                                            </p>

                                            <div className="bg-slate-800 text-blue-100 p-5 rounded-xl text-sm shadow-inner flex flex-col items-center gap-4 mb-6">
                                                <span className="text-xs font-bold text-slate-400">Benchmark Weight Calculation:</span>
                                                <Latex math={`\\text{Max Safe Weight (kg)} = \\frac{M_{\\text{fatigue\\_functional}}}{\\text{Lever Arm (Bone Diameter)} \\times \\text{Gravity (9.81)} \\times \\text{GRF (2.5)}}`} />
                                            </div>

                                            <div className="p-4 bg-blue-50 dark:bg-blue-900/20 border-l-4 border-blue-500 text-sm text-blue-900 dark:text-blue-200 italic mb-4">
                                                <strong>Why this matters:</strong> It translates abstract Newton-metres into a tangible clinical metric for educational comparison. It does not predict exactly when a plate will break in the real world, but it rigorously proves that—under identical, unprotected mechanical conditions—one specific plate configuration can indefinitely survive a much heavier dog than another.
                                            </div>

                                            <div className="p-4 bg-rose-50 dark:bg-rose-900/20 border-l-4 border-rose-500 text-sm text-rose-900 dark:text-rose-200 italic mb-4">
                                                <strong>Crucial Over-Approximation Caveat:</strong> This metric strictly evaluates the <em>fatigue stamina of the plate itself</em>. It is a theoretical over-approximation assuming that the screws and the bone-screw interfaces remain perfectly intact forever. In clinical reality, especially with hyper-stiff constructs, the screws will likely pull out or break long before the metal plate reaches this theoretical weight limit.
                                            </div>

                                            <div className="p-4 bg-slate-100 dark:bg-slate-800 border-l-4 border-slate-500 text-sm text-slate-800 dark:text-slate-200 italic">
                                                <strong>The Tension Band Illusion:</strong> In the Single Plate tab, if a metric is tagged "Tension Band", it assumes the bone is perfectly intact and sharing the load (Composite Theory). These numbers will look massive (e.g., 90kg for a tiny plate). <strong>Immediately post-op, the bone provides zero support.</strong> Clinicians must size plates based exclusively on the "Open-Gap" or Bridging metrics.
                                            </div>
                                        </section>
                                    </div>

                                    {/* PART F: MODELLING ASSUMPTIONS */}
                                    <div className="border-l-4 border-slate-400 pl-4 md:pl-6 pt-4 mt-12">
                                        <section className="mb-4">
                                            <h3 className="text-lg font-bold text-slate-800 dark:text-slate-300 pb-2 mb-4">Part F: Fundamental Modelling Assumptions & Caveats</h3>
                                            <p className="text-sm text-slate-700 dark:text-slate-300 mb-6 leading-relaxed">
                                                The mathematical models used in this calculator are based on exact textbook formulations for idealised beams. However, biological reality introduces variations. The following caveats are intentionally baked into the algorithms to provide the most conservative (safest) clinical estimation:
                                            </p>
                                            
                                            <div className="space-y-6">
                                                <div className="bg-slate-50 dark:bg-slate-900/30 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                                    <h4 className="font-bold text-slate-800 dark:text-slate-200 mb-2 text-sm flex items-center gap-2">
                                                        <WarnIcon /> A. Stress Ratio (<Latex math="R = -1" />) vs In-Vivo Loading (<Latex math="R = 0" />)
                                                    </h4>
                                                    <p className="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                                                        The <Latex math="S-N" /> data used in the fatigue calculations assumes a Stress Ratio of <Latex math="R = -1" />. This represents fully reversed loading (e.g., alternating between equal magnitudes of tension and compression). However, in-vivo bone loading during walking is predominantly zero-to-peak tension (<Latex math="R \approx 0" />). While Goodman’s criteria could mathematically correct for mean stress effects, adopting the <Latex math="R = -1" /> baseline serves as an appropriate, conservative educational comparison for implant stamina.
                                                    </p>
                                                </div>

                                                <div className="bg-slate-50 dark:bg-slate-900/30 p-5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                                    <h4 className="font-bold text-slate-800 dark:text-slate-200 mb-2 text-sm flex items-center gap-2">
                                                        <WarnIcon /> B. The "Rigid Coupling" Idealisation
                                                    </h4>
                                                    <p className="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">
                                                        The Parallel Axis Theorem (used to calculate <Latex math="I_{xx}" />, <Latex math="I_{yy}" />, and the product <Latex math="I_{xy}" />) assumes that both plates act as a single, perfectly bonded composite cross-section with 100% rigid shear transfer between them. In reality, the two plates are coupled only by screws and remaining intact bone ends across the comminuted gap. Because this coupling is incomplete, the true <Latex math="I_{xy}" /> might be smaller in vivo. 
                                                        <br/><br/>
                                                        <strong>Why we use it:</strong> By calculating the mathematically perfect rigid coupling, the algorithm establishes the absolute <em>upper limit</em> for stiffness and, conversely, the absolute <em>most severe</em> penalty for asymmetric bending stress. It represents the safest "worst-case" scenario.
                                                    </p>
                                                </div>
                                            </div>
                                        </section>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* REQUIRED FOOTER: Prevents the anti-tamper "Integrity Failed" error */}
                    <div id="watermark-cn" className="mt-8 text-center text-xs text-slate-500 dark:text-slate-400 w-full py-4 opacity-100 visible">
                        <p className="font-bold">{creatorText}</p>
                        <p className="italic max-w-2xl mx-auto mt-1">{disclaimerText}</p>
                    </div>

                </div>
            );
        }

        // Mount the React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
